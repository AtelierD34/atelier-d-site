<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atelier D.</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f3f0e8;
      color: #1f1f1f;
    }

    header {
      height: 72px;
      background: #f3f0e8;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 60px;
      position: relative;
      z-index: 10;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 38px;
    }

    nav a {
      text-decoration: none;
      color: #1f1f1f;
      font-size: 1rem;
    }

    .hero {
      position: relative;
      min-height: calc(100vh - 72px);
      background-image:
        linear-gradient(to right, rgba(0,0,0,0.42) 0%, rgba(0,0,0,0.18) 38%, rgba(0,0,0,0.05) 65%, rgba(0,0,0,0.02) 100%),
        url("60015cb8-e3c0-49d5-978b-a4368e82b0ae.JPEG");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      padding: 70px 90px;
    }

    .hero-content {
      max-width: 560px;
      color: white;
    }

    .hero-logo {
      width: 95px;
      height: auto;
      display: block;
      margin-bottom: 26px;
      filter: brightness(0) invert(1);
    }

    .hero h1 {
      font-size: 4.2rem;
      line-height: 1;
      margin-bottom: 14px;
    }

    .hero h2 {
      font-size: 1.1rem;
      font-weight: normal;
      margin-bottom: 28px;
    }

    .hero p {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      line-height: 1.7;
      max-width: 470px;
      margin-bottom: 34px;
    }

    .btn {
      display: inline-block;
      background: #7f8b78;
      color: white;
      text-decoration: none;
      padding: 16px 28px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
    }

    .btn:hover {
      background: #6f7b69;
    }

    @media (max-width: 900px) {
      header {
        justify-content: center;
        padding: 0 20px;
        height: auto;
        min-height: 72px;
      }

      nav ul {
        gap: 18px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 20px 0;
      }

      .hero {
        min-height: auto;
        padding: 50px 24px 70px 24px;
        background-position: center;
      }

      .hero-logo {
        width: 78px;
        margin-bottom: 20px;
      }

      .hero h1 {
        font-size: 2.8rem;
      }

      .hero h2 {
        font-size: 1.6rem;
        line-height: 1.3;
      }

      .hero p {
        font-size: 1rem;
      }

      .btn {
        width: 100%;
        max-width: 260px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="#">Créations</a></li>
        <li><a href="#">L’atelier</a></li>
        <li><a href="#">Galerie</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
     <img src="Logo_Site_transparent.png" alt="Logo Atelier D." class="hero-logo" />
      <h1>ATELIER D.</h1>
      <h2>Créations coutelières artisanales</h2>
      <p>
        Des pièces uniques et de petites séries, façonnées artisanalement
        entre acier, bois et matières naturelles.
      </p>
      <a href="#" class="btn">Découvrir les créations</a>
    </div>
  </section>
</body>
</html>
